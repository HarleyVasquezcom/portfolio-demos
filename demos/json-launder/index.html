<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>JSON Launder — Format · Validate · Minify</title>
<style>
  :root { --bg:#09090b; --bg-elev:#131316; --fg:#fafafa; --muted:#a1a1aa; --border:#27272a; --border-hover:#3f3f46; --accent:#10b981; --err:#f87171; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:var(--bg); color:var(--fg); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; padding:24px; }
  .wrap { max-width:1200px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  h1 { font-size:18px; } h1 span { color:var(--accent); }
  .status { font-size:13px; color:var(--muted); } .status.ok { color:var(--accent); } .status.err { color:var(--err); }
  .cols { display:grid; grid-template-columns:1fr 1fr; gap:14px; }
  @media (max-width:760px){ .cols { grid-template-columns:1fr; } }
  .col { display:flex; flex-direction:column; gap:8px; }
  .col label { color:var(--muted); font-size:12px; letter-spacing:.1em; }
  textarea { width:100%; min-height:480px; resize:vertical; background:var(--bg-elev); border:1px solid var(--border); border-radius:12px; color:var(--fg); padding:14px; font:inherit; font-size:13px; line-height:1.6; }
  textarea:focus { outline:none; border-color:var(--border-hover); }
  .tools { display:flex; gap:8px; flex-wrap:wrap; margin-top:6px; }
  .tools button { border:1px solid var(--border); background:var(--bg-elev); color:var(--fg); font:inherit; font-size:12px; padding:8px 13px; border-radius:9px; cursor:pointer; transition:all .2s; }
  .tools button:hover { border-color:var(--accent); color:var(--accent); }
  #copyok { color:var(--accent); font-size:12px; opacity:0; transition:opacity .3s; align-self:center; }
  #copyok.show { opacity:1; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>JSON<span>·</span>LAUNDER</h1>
      <div class="status" id="status">paste JSON to begin</div>
    </header>
    <div class="cols">
      <div class="col">
        <label>INPUT</label>
        <textarea id="input" placeholder='{"paste": "your json here"}…'></textarea>
      </div>
      <div class="col">
        <label>OUTPUT</label>
        <textarea id="output" readonly></textarea>
      </div>
    </div>
    <div class="tools">
      <button id="fmt">Format · 2 spaces</button>
      <button id="fmt4">Format · 4 spaces</button>
      <button id="min">Minify</button>
      <button id="copy">Copy output</button>
      <span id="copyok">copied ✓</span>
    </div>
  </div>
<script>
const input = document.getElementById('input');
const output = document.getElementById('output');
const status = document.getElementById('status');
const copyOk = document.getElementById('copyok');

function launder(indent) {
  const raw = input.value.trim();
  if (!raw) { output.value = ''; renderStatus('waiting'); return; }
  try {
    const parsed = JSON.parse(raw);
    output.value = JSON.stringify(parsed, null, indent);
    renderStatus('valid');
  } catch (e) {
    output.value = '';
    renderStatus(`error · ${e.message.split('\n')[0]}`);
  }
}
function renderStatus(kind) {
  status.className = 'status' + (kind === 'valid' ? ' ok' : (kind !== 'waiting' ? ' err' : ''));
  status.textContent = kind === 'valid' ? '✓ valid JSON' : kind === 'waiting' ? 'paste JSON to begin' : kind;
}

document.getElementById('fmt').addEventListener('click', () => launder(2));
document.getElementById('fmt4').addEventListener('click', () => launder(4));
document.getElementById('min').addEventListener('click', () => launder(0));
document.getElementById('copy').addEventListener('click', () => {
  navigator.clipboard.writeText(output.value).then(() => {
    copyOk.classList.add('show');
    setTimeout(() => copyOk.classList.remove('show'), 1400);
  });
});
input.addEventListener('input', () => launder(2));
launder(2);
</script>
</body>
</html>
