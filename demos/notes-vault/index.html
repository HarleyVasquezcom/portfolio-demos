<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Notes Vault - Editorial Notebook</title>
<style>
  :root{
    --paper:#FAF7F0;
    --paper-deep:#F5F1E8;
    --ink:#23201C;
    --ink-soft:#5A544A;
    --bordeau:#8E2F3B;
    --bordeau-deep:#7A2732;
    --line:#D8D1C4;
    --line-soft:#E7E1D4;
    --white:#FFFFFF;
    --shadow:0 1px 2px rgba(58,49,33,.08), 0 6px 18px rgba(58,49,33,.06);
    --serif:Georgia, "Times New Roman", Times, serif;
    --sans:-apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  }
  *{ box-sizing:border-box; margin:0; padding:0; }
  html,body{ height:100%; }
  body{ background:var(--paper); color:var(--ink); font-family:var(--serif); font-size:16px; line-height:1.6; min-height:100vh; }
  button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
  :focus-visible{ outline:2px solid var(--bordeau); outline-offset:2px; }

  .app{ display:grid; grid-template-columns:310px 1fr; height:100vh; }

  /* sidebar */
  .sidebar{ background:var(--paper-deep); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0; }
  .notebook{ padding:22px 20px 14px; border-bottom:1px solid var(--line); }
  .brand{ display:flex; align-items:center; justify-content:space-between; gap:8px; }
  .brand h1{ font-size:20px; font-weight:700; }
  .brand h1 em{ font-style:italic; color:var(--bordeau); }
  .counter{ font-family:var(--sans); font-size:11px; letter-spacing:.12em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--line); padding:3px 8px; border-radius:99px; white-space:nowrap; }
  .searchbox{ margin-top:14px; }
  .searchbox label{ display:block; font-family:var(--sans); font-size:11px; text-transform:uppercase; letter-spacing:.1em; color:var(--ink-soft); margin-bottom:6px; }
  .searchbox input{ width:100%; font-family:var(--sans); font-size:14px; color:var(--ink); background:var(--white); border:1px solid var(--line); border-radius:6px; padding:9px 11px; }
  .actions{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-top:14px; }
  .btn{ font-family:var(--sans); font-size:13px; font-weight:600; color:var(--ink); background:var(--white); border:1px solid var(--line); border-radius:6px; padding:8px 6px; transition:all .15s; }
  .btn:hover{ border-color:var(--ink-soft); }
  .btn.primary{ background:var(--bordeau); border-color:var(--bordeau); color:var(--white); }
  .btn.primary:hover{ background:var(--bordeau-deep); }

  .list-data-wrap{ flex:1; overflow-y:auto; padding:10px 12px; }
  .note-item{ display:grid; grid-template-columns:34px 1fr auto; gap:10px; align-items:start; width:100%; text-align:left; padding:11px 10px; border-radius:6px; border-bottom:1px solid var(--line-soft); }
  .note-item:hover{ background:rgba(142,47,59,.05); }
  .note-item.active{ background:var(--white); box-shadow:var(--shadow); border-bottom-color:transparent; }
  .posnum{ font-family:var(--sans); font-size:12px; font-weight:700; color:var(--bordeau); margin-top:3px; font-variant-numeric:tabular-nums; }
  .note-meta{ min-width:0; }
  .note-title{ font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .note-snippet{ font-family:var(--sans); font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
  .note-pin-badge{ width:18px; height:18px; background:var(--bordeau); color:var(--white); font-family:var(--sans); font-size:10px; font-weight:700; display:flex; align-items:center; justify-content:center; clip-path:polygon(0 0,100% 0,100% 66%,50% 100%,0 66%); }
  .empty-list{ padding:26px 14px; text-align:center; color:var(--ink-soft); font-style:italic; font-size:14px; }

  /* main */
  .main{ min-width:0; min-height:0; overflow-y:auto; }
  .editor-frame{ max-width:780px; margin:0 auto; padding:34px 36px 60px; }
  .editor-meta{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:18px; }
  .modified{ font-family:var(--sans); font-size:12px; color:var(--ink-soft); }
  .toolbar{ display:flex; gap:6px; }
  .tool{ font-family:var(--sans); font-size:12px; border:1px solid var(--line); background:var(--white); border-radius:5px; padding:5px 9px; }
  .tool:hover{ border-color:var(--ink-soft); }
  .tool.danger:hover{ border-color:var(--bordeau); color:var(--bordeau); }
  .tool.on{ background:var(--bordeau); border-color:var(--bordeau); color:var(--white); }

  .title-input{ width:100%; font-family:var(--serif); font-size:30px; font-weight:700; line-height:1.2; color:var(--ink); background:transparent; border:none; border-bottom:2px solid var(--line); padding:6px 2px 10px; margin-bottom:22px; }
  .title-input:focus-visible{ outline:none; border-bottom-color:var(--bordeau); }

  .tabs{ display:flex; gap:4px; margin-bottom:14px; border-bottom:1px solid var(--line); }
  .tab{ font-family:var(--sans); font-size:12px; text-transform:uppercase; letter-spacing:.08em; color:var(--ink-soft); padding:8px 14px; border-bottom:2px solid transparent; margin-bottom:-1px; }
  .tab.active{ color:var(--bordeau); border-bottom-color:var(--bordeau); font-weight:700; }

  .body-input{ flex:1; min-height:320px; width:100%; resize:vertical; font-family:var(--serif); font-size:16px; line-height:1.75; color:var(--ink); background:transparent; border:none; }
  .body-input:focus-visible{ outline:none; }

  .preview{ min-height:320px; padding-bottom:40px; }
  .preview h2{ font-size:24px; line-height:1.3; border-bottom:1px solid var(--line); padding-bottom:10px; }
  .preview h3{ font-size:19px; margin:22px 0 8px; }
  .preview p{ margin:0 0 14px; }
  .preview ul{ list-style:none; margin:0 0 14px; padding:0; }
  .preview li{ position:relative; padding-left:26px; margin-bottom:7px; }
  .preview li::before{ content:""; position:absolute; left:7px; top:.62em; width:8px; height:8px; transform:rotate(45deg); border:1.5px solid var(--bordeau); }
  .preview li.done::before{ background:var(--bordeau); border-color:var(--bordeau); }
  .preview li.done{ color:var(--ink-soft); text-decoration:line-through; }
  .preview code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.85em; background:var(--paper-deep); border:1px solid var(--line-soft); padding:1px 5px; border-radius:4px; color:var(--bordeau); }

  .frame-box{ border:1.5px solid var(--bordeau); padding:16px 18px; margin-top:22px; position:relative; }
  .frame-box .frame-label{ position:absolute; top:-11px; left:12px; background:var(--paper); padding:0 8px; font-family:var(--sans); font-size:11px; text-transform:uppercase; letter-spacing:.12em; color:var(--bordeau); }
  .frame-box p{ font-size:14px; color:var(--ink-soft); }
  .frame-box code{ font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; font-size:.9em; background:var(--paper-deep); padding:0 4px; border-radius:3px; color:var(--bordeau); }

  /* drag overlay */
  .drop-veil{ position:fixed; inset:0; background:rgba(142,47,59,.12); border:3px dashed var(--bordeau); display:none; align-items:center; justify-content:center; z-index:20; pointer-events:none; font-family:var(--serif); font-size:22px; color:var(--bordeau); }
  .drop-veil.on{ display:flex; }

  @media (max-width:760px){
    .app{ grid-template-columns:1fr; grid-template-rows:auto 1fr; height:100vh; }
    .sidebar{ border-right:none; border-bottom:1px solid var(--line); }
  }
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" aria-label="Notes collection">
    <div class="notebook">
      <div class="brand">
        <h1>Notes <em>Vault</em></h1>
        <span class="counter" id="counter" aria-live="polite">0 notes</span>
      </div>
      <div class="searchbox">
        <label for="search">Search notes</label>
        <input id="search" type="text" autocomplete="off" placeholder="Filter by text..." />
      </div>
      <div class="actions">
        <button id="btn-new" class="btn primary">+ New note</button>
        <button id="btn-export-all" class="btn">Export vault</button>
      </div>
    </div>
    <div class="list-data-wrap">
      <div id="list" role="list" aria-label="Note list"></div>
    </div>
  </aside>

  <main class="main" id="main" aria-label="Note editor">
    <div class="editor-frame">
      <div class="editor-meta">
        <span class="modified" id="modified">Not saved yet</span>
        <div class="toolbar">
          <button id="btn-pin" class="tool" aria-pressed="false">Pin</button>
          <button id="btn-duplicate" class="tool">Duplicate</button>
          <button id="btn-export" class="tool">Export</button>
          <button id="btn-delete" class="tool danger">Delete</button>
        </div>
      </div>

      <div class="tabs" role="tablist" aria-label="write or preview">
        <button id="tab-edit" class="tab active" role="tab" aria-selected="true">Write</button>
        <button id="tab-preview" class="tab" role="tab" aria-selected="false">Preview</button>
      </div>

      <input id="title-input" class="title-input" type="text" placeholder="Untitled note" aria-label="Note title" />

      <textarea id="body-input" class="body-input" aria-label="Note body"
        placeholder="Write here. Use - [ ] / - [x] checklists, - bullets, # and ## headings, `inline code`."></textarea>

      <div id="preview" class="preview" hidden></div>

      <div class="frame-box" role="note">
        <span class="frame-label">Hint</span>
        <p>Line <code>- [ ]</code> opens a checkbox, <code>- [x]</code> closes it.<br />
        <code>#</code> / <code>##</code> start a heading and backticks wrap <code>inline code</code>.
        Everything autosaves. Export a note as <code>.md</code>, the vault as <code>.json</code>;
        drop or paste a vault file here to import.</p>
      </div>
    </div>
  </main>

</div>

<input id="file-input" type="file" accept=".json,application/json" hidden />
<div class="drop-veil" id="drop-veil">Drop vault JSON to import</div>

<script>
(function(){
  "use strict";

  var STORE_KEY = "notes-vault-v1";

  function $(id){ return document.getElementById(id); }

  function newId(){
    return Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,9);
  }
  function nowISO(){ return new Date().toISOString(); }

  function stamp(n){
    var t = nowISO();
    return {
      id: (n && n.id) ? n.id : newId(),
      title: (n && n.title !== undefined) ? String(n.title) : "",
      body: (n && n.body !== undefined) ? String(n.body) : "",
      pinned: !!(n && n.pinned),
      createdAt: (n && n.createdAt) || t,
      updatedAt: (n && n.updatedAt) || t
    };
  }

  function snippetOf(n){
    var b = String(n.body || "")
      .replace(/^[#>\[\]x\- ]+/gm, "")
      .replace(/`/g, "")
      .replace(/\s+/g, " ")
      .trim();
    return b ? b : "(no body)";
  }

  function timeAgo(iso){
    if(!iso) return "never";
    var s = (Date.now() - new Date(iso).getTime()) / 1000;
    if(s < 60) return "just now";
    if(s < 3600) return Math.floor(s / 60) + " min ago";
    if(s < 86400) return Math.floor(s / 3600) + " hr ago";
    return Math.floor(s / 86400) + " day" + (Math.floor(s / 86400) > 1 ? "s" : "") + " ago";
  }

  /* ---------- store ---------- */
  var seed = stamp({
    title: "Welcome to your vault",
    body: "# Getting started\n\n## Make a checklist\n- [x] Create notes in the sidebar\n- [x] Pin your favorite\n- [ ] Export the vault\n\nEverything lives locally and autosaves.\n\nTry inline code: open(file, \"r\")"
  });

  var store;
  function loadStore(){
    var raw = null;
    try { raw = JSON.parse(localStorage.getItem(STORE_KEY)); } catch(e){ raw = null; }
    if(!raw || !Array.isArray(raw.notes)) raw = { notes: [seed] };
    store = { notes: (raw.notes || []).map(stamp) };
    if(store.notes.length === 0) store.notes.push(stamp(seed));
  }
  function saveStore(){
    try { localStorage.setItem(STORE_KEY, JSON.stringify(store)); } catch(e){}
  }

  /* ---------- dom refs ---------- */
  var listEl = $("list"), searchEl = $("search"), counterEl = $("counter");
  var titleInput = $("title-input"), bodyInput = $("body-input");
  var previewEl = $("preview"), modifiedEl = $("modified");
  var tabEdit = $("tab-edit"), tabPreview = $("tab-preview");
  var btnNew = $("btn-new"), btnPin = $("btn-pin"), btnDup = $("btn-duplicate");
  var btnExport = $("btn-export"), btnExportAll = $("btn-export-all"), btnDelete = $("btn-delete");
  var fileInput = $("file-input"), veilEl = $("drop-veil");

  var activeId = null, saveTimer = null, dragDepth = 0;

  loadStore();
  activeId = store.notes.length ? store.notes[0].id : null;

  function current(){
    for(var i = 0; i < store.notes.length; i++){
      if(store.notes[i].id === activeId) return store.notes[i];
    }
    return null;
  }
  function setActive(id){ activeId = id; render(); }

  /* ---------- markdown-light ---------- */
  function esc(s){
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }
  function inline(s){
    return esc(s).replace(/`([^`]+)`/g, function(_, c){ return "<code>" + c + "</code>"; });
  }
  function renderBody(src){
    var lines = String(src || "").split("\n");
    var out = [], inList = false;
    function closeList(){ if(inList){ out.push("</ul>"); inList = false; } }
    for(var i = 0; i < lines.length; i++){
      var raw = lines[i].replace(/^\s+|\s+$/g, "");
      if(!raw){ closeList(); continue; }
      var m;
      m = /^##\s+(.*)$/.exec(raw); if(m){ closeList(); out.push("<h3>" + inline(m[1]) + "</h3>"); continue; }
      m = /^#\s+(.*)$/.exec(raw);  if(m){ closeList(); out.push("<h2>" + inline(m[1]) + "</h2>"); continue; }
      m = /^-\s*\[x\]\s+(.*)$/i.exec(raw); if(m){ if(!inList){ out.push("<ul>"); inList = true; } out.push("<li class=\"done\">" + inline(m[1]) + "</li>"); continue; }
      m = /^-\s*\[ \]\s+(.*)$/.exec(raw);  if(m){ if(!inList){ out.push("<ul>"); inList = true; } out.push("<li>" + inline(m[1]) + "</li>"); continue; }
      if(/^-\s+/.test(raw)){
        if(!inList){ out.push("<ul>"); inList = true; }
        out.push("<li>" + inline(raw.replace(/^-\s+/, "")) + "</li>");
        continue;
      }
      if(inList) closeList();
      out.push("<p>" + inline(raw) + "</p>");
    }
    closeList();
    return out.join("");
  }

  /* ---------- list ---------- */
  function filtered(){
    var q = (searchEl.value || "").toLowerCase().trim();
    return store.notes.filter(function(n){
      if(!q) return true;
      return (n.title + "\n" + n.body).toLowerCase().indexOf(q) !== -1;
    }).sort(function(a,b){
      if(a.pinned !== b.pinned) return a.pinned ? -1 : 1;
      return b.updatedAt.localeCompare(a.updatedAt);
    });
  }
  function renderList(){
    var list = filtered();
    counterEl.textContent = list.length + " note" + (list.length === 1 ? "" : "s");
    if(!list.length){ listEl.innerHTML = "<div class=\"empty-list\">No notes match</div>"; return; }
    var html = "";
    for(var i = 0; i < list.length; i++){
      var n = list[i];
      html += "<button class=\"note-item" + (n.id === activeId ? " active" : "") + "\" role=\"listitem\" data-id=\"" + n.id + "\">"
        + "<span class=\"posnum\">" + (i + 1) + "</span>"
        + "<span class=\"note-meta\"><span class=\"note-title\">" + esc(n.title || "Untitled") + "</span>"
        + "<span class=\"note-snippet\">" + esc(snippetOf(n.body)) + "</span></span>"
        + (n.pinned ? "<span class=\"note-pin-badge\" aria-label=\"pinned\">P</span>" : "")
        + "</button>";
    }
    listEl.innerHTML = html;
    var items = listEl.querySelectorAll(".note-item");
    for(i = 0; i < items.length; i++){
      (function(el){
        el.addEventListener("click", function(){ setActive(el.getAttribute("data-id")); });
      })(items[i]);
    }
  }

  /* ---------- editor ---------- */
  function renderPreview(){
    previewEl.innerHTML = renderBody(bodyInput.value);
  }
  function showTab(write){
    var w = !!write;
    tabEdit.classList.toggle("active", w);
    tabPreview.classList.toggle("active", !w);
    tabEdit.setAttribute("aria-selected", w ? "true" : "false");
    tabPreview.setAttribute("aria-selected", w ? "false" : "true");
    bodyInput.hidden = !w;
    previewEl.hidden = w;
  }
  function render(){
    renderList();
    var n = current();
    if(!n) return;
    titleInput.value = n.title;
    bodyInput.value = n.body;
    var pinned = !!n.pinned;
    btnPin.classList.toggle("on", pinned);
    btnPin.setAttribute("aria-pressed", pinned ? "true" : "false");
    btnPin.textContent = pinned ? "Unpin" : "Pin";
    modifiedEl.textContent = "Edited " + timeAgo(n.updatedAt);
    renderPreview();
  }

  function touch(n){ n.updatedAt = nowISO(); saveStore(); render(); }

  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveStore(); render(); }, 500);
  }

  btnNew.addEventListener("click", function(){
    var c = stamp({ title: "", body: "" });
    store.notes.unshift(c);
    setActive(c.id);
    titleInput.focus();
  });
  btnPin.addEventListener("click", function(){
    var n = current(); if(!n) return; n.pinned = !n.pinned; touch(n);
  });
  btnDup.addEventListener("click", function(){
    var n = current(); if(!n) return;
    var c = stamp({ title: (n.title || "Untitled") + " (copy)", body: n.body, pinned: false });
    store.notes.unshift(c);
    setActive(c.id);
  });
  btnDelete.addEventListener("click", function(){
    var n = current(); if(!n) return;
    if(window.confirm("Delete this note?")){
      store.notes = store.notes.filter(function(x){ return x.id !== n.id; });
      setActive(store.notes.length ? store.notes[0].id : null);
      saveStore();
    }
  });

  titleInput.addEventListener("input", function(){
    var n = current(); if(!n) return; n.title = titleInput.value; scheduleSave();
  });
  bodyInput.addEventListener("input", function(){
    var n = current(); if(!n) return; n.body = bodyInput.value; renderPreview(); scheduleSave();
  });
  function scheduleSave(){
    clearTimeout(saveTimer);
    saveTimer = setTimeout(function(){ saveStore(); render(); }, 500);
  }

  searchEl.addEventListener("input", renderList);

  tabEdit.addEventListener("click", function(){ showTab(true); });
  tabPreview.addEventListener("click", function(){ showTab(false); });

  /* ---------- export ---------- */
  function download(name, text, mime){
    var blob = new Blob([text], { type: mime || "application/octet-stream" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(function(){ URL.revokeObjectURL(url); }, 100);
  }
  var mdTitle = function(n){ return (n.title || "Untitled") + ".md"; };
  var slug = function(n){ return (n.title || "untitled").toLowerCase().replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "") || "note"; };

  btnExport.addEventListener("click", function(){
    var n = current(); if(!n) return;
    var md = "# " + (n.title || "Untitled") + "\n\n" + (n.body || "") + "\n";
    download(slug(n) + ".md", md, "text/markdown");
  });
  btnExportAll.addEventListener("click", function(){
    download("notes-vault.json", JSON.stringify(store, null, 2), "application/json");
  });

  /* ---------- import ---------- */
  function importVault(jsonText){
    var data;
    try { data = JSON.parse(jsonText); }
    catch(e){ window.alert("That file is not valid JSON."); return; }
    var arr = Array.isArray(data) ? data : (data.notes || null);
    if(!Array.isArray(arr)){
      window.alert("No notes found in that JSON (expected { notes: [] }).");
      return;
    }
    var added = 0;
    for(var i = 0; i < arr.length; i++){
      if(arr[i] && typeof arr[i] === "object" && arr[i].title !== undefined){
        store.notes.unshift(stamp(arr[i]));
        added++;
      }
    }
    if(added === 0){ window.alert("No importable notes found."); return; }
    setActive(store.notes[0].id);
    saveStore();
    window.alert(added + " note" + (added === 1 ? "" : "s") + " imported.");
  }

  fileInput.addEventListener("change", function(){
    var f = fileInput.files && fileInput.files[0];
    if(!f) return;
    var r = new FileReader();
    r.onload = function(){ importVault(String(r.result)); };
    r.readAsText(f);
    fileInput.value = "";
  });

  document.addEventListener("dragover", function(e){
    e.preventDefault();
    if(!dragDepth){ veilEl.classList.add("on"); }
    dragDepth++;
  });
  document.addEventListener("dragleave", function(e){
    e.preventDefault();
    dragDepth = Math.max(0, dragDepth - 1);
    if(dragDepth === 0) veilEl.classList.remove("on");
  });
  document.addEventListener("drop", function(e){
    e.preventDefault();
    dragDepth = 0;
    veilEl.classList.remove("on");
    var f = e.dataTransfer && e.dataTransfer.files && e.dataTransfer.files[0];
    if(f){
      var r = new FileReader();
      r.onload = function(){ importVault(String(r.result)); };
      r.readAsText(f);
    }
  });

  document.addEventListener("paste", function(e){
    var text = e.clipboardData && e.clipboardData.getData("text");
    if(text && /^\s*[\[{]/.test(text)){ e.preventDefault(); importVault(text); }
  });

  /* ---------- init ---------- */
  render();
})();
</script>
</body>
</html>
