<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Palette Loom — Color Palette Generator</title>
<style>
  :root { --bg:#09090b; --bg-elev:#131316; --fg:#fafafa; --muted:#a1a1aa; --border:#27272a; --border-hover:#3f3f46; --accent:#d946ef; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:radial-gradient(1000px 500px at 80% -10%, rgba(217,70,239,.09), transparent 60%), var(--bg); color:var(--fg); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; padding:24px; }
  .wrap { max-width:1000px; margin:0 auto; }
  header { display:flex; align-items:center; justify-content:space-between; margin-bottom:20px; }
  h1 { font-size:18px; } h1 span { color:var(--accent); }
  .controls { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:20px; }
  .btn { border:1px solid var(--border); background:var(--bg-elev); color:var(--fg); font:inherit; font-size:13px; padding:9px 16px; border-radius:10px; cursor:pointer; transition:all .2s; }
  .btn:hover { border-color:var(--accent); color:var(--accent); }
  label.seed { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:12px; }
  input[type=number] { width:54px; background:var(--bg-elev); border:1px solid var(--border); border-radius:8px; color:var(--fg); font:inherit; padding:6px 8px; }
  input[type=checkbox] { accent-color:var(--accent); }
  .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
  @media (max-width:760px){ .grid { grid-template-columns:repeat(2,1fr); } }
  .swatch { border:1px solid var(--border); border-radius:14px; overflow:hidden; background:var(--bg-elev); }
  .swatch .tile { height:120px; position:relative; }
  .swatch .tile .lock { position:absolute; top:8px; right:8px; background:rgba(0,0,0,.5); border:none; color:#fff; font-size:12px; line-height:1; width:26px; height:26px; border-radius:8px; cursor:pointer; }
  .swatch .meta { padding:10px 12px; display:flex; flex-direction:column; gap:2px; font-size:12px; }
  .swatch .hex { color:var(--fg); cursor:pointer; }
  .swatch .meta span:last-child { color:var(--muted); }
  #copyok { color:var(--accent); font-size:12px; opacity:0; transition:opacity .3s; }
  #copyok.show { opacity:1; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>PALETTE<span>·</span>LOOM</h1>
      <div style="display:flex;align-items:center;gap:10px">
        <button class="btn" id="gen">↻ Generate</button>
        <span id="copyok">copied ✓</span>
      </div>
    </header>
    <div class="controls">
      <label class="seed">Seed <input type="number" id="seed" value="42" min="0" /></label>
      <label class="seed"><input type="checkbox" id="harmonic" checked /> harmonic harmony</label>
    </div>
    <div class="grid" id="grid"></div>
  </div>
<script>
const grid = document.getElementById('grid');
let locked = [];

function mulberry32(a) {
  return function() {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
function hslToHex(h, s, l) {
  s /= 100; l /= 100;
  const k = n => (n + h / 30) % 12;
  const a = s * Math.min(l, 1 - l);
  const f = n => l - a * Math.max(-1, Math.min(k(n) - 3, Math.min(9 - k(n), 1)));
  const to = x => Math.round(255 * x).toString(16).padStart(2, '0');
  return '#' + to(f(0)) + to(f(8)) + to(f(4));
}

function generate() {
  const seed = Math.max(0, parseInt(document.getElementById('seed').value, 10) || 0);
  const rnd = mulberry32(seed);
  const harmonic = document.getElementById('harmonic').checked;
  const baseH = Math.floor(rnd() * 360);
  const angles = [0, 137.5, 275, 55, 192.5];
  grid.innerHTML = '';
  for (let i = 0; i < 5; i++) {
    const h = harmonic ? (baseH + angles[i]) % 360 : Math.floor(rnd() * 360);
    const s = 55 + Math.floor(rnd() * 35);
    const l = 55 + Math.floor(rnd() * 30);
    const hex = hslToHex(h, s, l);
    const sw = document.createElement('div');
    sw.className = 'swatch';
    const tile = document.createElement('div');
    tile.className = 'tile';
    tile.style.background = hex;
    const lockBtn = document.createElement('button');
    lockBtn.className = 'lock';
    lockBtn.textContent = locked.includes(i) ? '🔒' : '🔓';
    lockBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      locked = locked.includes(i) ? locked.filter(x => x !== i) : locked.concat(i);
      lockBtn.textContent = locked.includes(i) ? '🔒' : '🔓';
    });
    tile.appendChild(lockBtn);
    const meta = document.createElement('div');
    meta.className = 'meta';
    const hexEl = document.createElement('span');
    hexEl.className = 'hex';
    hexEl.textContent = hex;
    hexEl.addEventListener('click', () => navigator.clipboard.writeText(hex).then(() => {
      document.getElementById('copyok').classList.add('show');
      setTimeout(() => document.getElementById('copyok').classList.remove('show'), 1400);
    }));
    const lbl = document.createElement('span');
    lbl.textContent = `h${Math.round(h)}° s${Math.round(s)}% l${Math.round(l)}%`;
    meta.appendChild(hexEl);
    meta.appendChild(lbl);
    sw.appendChild(tile);
    sw.appendChild(meta);
    grid.appendChild(sw);
  }
}
document.getElementById('gen').addEventListener('click', generate);
document.getElementById('seed').addEventListener('change', generate);
document.getElementById('harmonic').addEventListener('change', generate);
generate();
</script>
</body>
</html>
