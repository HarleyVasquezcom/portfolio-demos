<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Crypto Dashboard — Live-ish Market Terminal</title>
<style>
  :root {
    --bg: #09090b;
    --bg-elev: #131316;
    --bg-card: #18181b;
    --fg: #fafafa;
    --muted: #a1a1aa;
    --border: #27272a;
    --border-hover: #3f3f46;
    --up: #34d399;
    --down: #f87171;
    --accent: #22d3ee;
    --accent-alt: #a78bfa;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background:
      radial-gradient(1200px 600px at 80% -10%, rgba(34,211,238,0.08), transparent 60%),
      var(--bg);
    color: var(--fg);
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
    padding: 32px 20px;
  }
  .wrap { max-width: 1080px; margin: 0 auto; }
  header {
    display: flex; flex-wrap: wrap; align-items: center; justify-content: space-between;
    gap: 16px; margin-bottom: 24px;
  }
  h1 { font-size: 22px; font-weight: 700; letter-spacing: -0.02em; }
  h1 span { color: var(--accent); }
  .controls { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .controls button {
    border: 1px solid var(--border); background: var(--bg-card); color: var(--muted);
    font: inherit; font-size: 12px; padding: 7px 12px; border-radius: 8px; cursor: pointer;
    transition: all .2s ease;
  }
  .controls button:hover { color: var(--fg); border-color: var(--border-hover); }
  .controls button.active { color: var(--accent); border-color: var(--accent); }
  .spotlight {
    border: 1px solid var(--border); background: var(--bg-elev); color: var(--muted);
    font: inherit; font-size: 12px; padding: 7px 12px; border-radius: 8px; width: 200px;
  }
  .grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 14px;
  }
  .card {
    background: var(--bg-card); border: 1px solid var(--border); border-radius: 14px;
    padding: 16px; transition: border-color .2s ease, transform .2s ease;
  }
  .card:hover { border-color: var(--border-hover); transform: translateY(-2px); }
  .card.fav { border-color: var(--accent-alt); }
  .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .symbol { font-size: 13px; color: var(--muted); }
  .name { font-size: 15px; font-weight: 600; margin-top: 2px; }
  .price { font-size: 22px; font-weight: 700; margin-top: 12px; font-variant-numeric: tabular-nums; }
  .chg { font-size: 13px; margin-top: 4px; font-variant-numeric: tabular-nums; }
  .chg.up { color: var(--up); }
  .chg.down { color: var(--down); }
  .spark { margin-top: 12px; }
  .spark svg { display: block; width: 100%; height: 44px; }
  .star {
    background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px;
    padding: 2px 4px; transition: color .2s ease;
  }
  .star.favd { color: var(--accent-alt); }
  footer { margin-top: 28px; color: var(--muted); font-size: 12px; text-align: center; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>CRYPTO<span>·TERM</span></h1>
      <div class="controls">
        <input id="search" class="spotlight" type="search" placeholder="search symbol…" autocomplete="off" />
        <button id="btn-all" class="active">All</button>
        <button id="btn-fav">Favorites</button>
        <button id="refresh">↻ refresh</button>
      </div>
    </header>
    <div id="grid" class="grid" aria-live="polite"></div>
    <footer>Simulated live ticker · demo data · add to favorites with ★</footer>
  </div>
<script>
const BASE = [
  ['BTC', 'Bitcoin', 67124, '#f7931a'],
  ['ETH', 'Ethereum', 3287, '#627eea'],
  ['SOL', 'Solana', 164.2, '#14f195'],
  ['ADA', 'Cardano', 0.642, '#0033ad'],
  ['AVAX', 'Avalanche', 38.4, '#e84142'],
  ['DOT', 'Polkadot', 7.85, '#e6007a'],
  ['LINK', 'Chainlink', 18.6, '#2a5ada'],
  ['MATIC', 'Polygon', 0.89, '#8247e5'],
  ['ATOM', 'Cosmos', 9.12, '#2e3148'],
  ['XRP', 'Ripple', 0.58, '#00aae4'],
  ['LTC', 'Litecoin', 91.3, '#345d9d'],
  ['DOGE', 'Dogecoin', 0.162, '#c2a633'],
];

const state = new Map(BASE.map(([s, n, p, c]) => [s, { name: n, price: p, color: c, spark: seedSpark(p), fav: false }]));
let favs = false;
let query = '';

function seedSpark(base) {
  const arr = [];
  let v = base;
  for (let i = 0; i < 24; i++) { v *= 1 + (Math.random() - 0.5) * 0.02; arr.push(v); }
  return arr;
}

function tick() {
  for (const row of state.values()) {
    const drift = (Math.random() - 0.5) * 0.012;
    row.price *= 1 + drift;
    row.spark.push(row.price);
    if (row.spark.length > 24) row.spark.shift();
  }
}

function render() {
  const grid = document.getElementById('grid');
  grid.innerHTML = '';
  let list = BASE.map(([s]) => s);
  if (query) list = list.filter((s) => s.toLowerCase().includes(query));
  else if (favs) list = list.filter((s) => state.get(s).fav);
  if (list.length === 0) {
    grid.innerHTML = '<p style="grid-column:1/-1;color:var(--muted);text-align:center;padding:40px 0">Nothing here.</p>';
    return;
  }
  for (const s of list) {
    const d = state.get(s);
    const prev = d.spark[d.spark.length - 2] ?? d.price;
    const chg = ((d.price - prev) / prev) * 100;
    const up = chg >= 0;
    grid.appendChild(card(s, d, chg, up));
  }
}

function card(s, d, chg, up) {
  const el = document.createElement('article');
  el.className = 'card' + (d.fav ? ' fav' : '');
  el.innerHTML = `
    <div class="row1">
      <div>
        <div class="symbol">${s} · <span style="color:${d.color}">⬤</span></div>
        <div class="name">${d.name}</div>
      </div>
      <button class="star${d.fav ? ' favd' : ''}" aria-label="toggle favorite">${d.fav ? '★' : '☆'}</button>
    </div>
    <div class="price">$${d.price.toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 })}</div>
    <div class="chg ${up ? 'up' : 'down'}">${up ? '▲' : '▼'} ${Math.abs(chg).toFixed(2)}% (24h)</div>
    <div class="spark"><canvas></canvas></div>`;
  el.querySelector('.star').addEventListener('click', () => {
    d.fav = !d.fav;
    if (favs && !d.fav) render(); else render();
  });
  const cv = el.querySelector('canvas');
  drawSpark(cv, d.spark, up);
  return el;
}

function drawSpark(cv, data, up) {
  const w = 200, h = 44;
  cv.width = w; cv.height = h;
  const g = cv.getContext('2d');
  const min = Math.min(...data), max = Math.max(...data);
  const span = max - min || 1;
  g.clearRect(0, 0, w, h);
  g.beginPath();
  data.forEach((v, i) => {
    const x = (i / (data.length - 1)) * w;
    const y = h - 4 - ((v - min) / span) * (h - 8);
    i === 0 ? g.moveTo(x, y) : g.lineTo(x, y);
  });
  g.strokeStyle = up ? '#34d399' : '#f87171';
  g.lineWidth = 1.6;
  g.stroke();
}

document.getElementById('search').addEventListener('input', (e) => {
  query = e.target.value.trim().toLowerCase();
  render();
});
document.getElementById('btn-all').addEventListener('click', () => { favs = false; toggleActive(); render(); });
document.getElementById('btn-fav').addEventListener('click', () => { favs = true; toggleActive(); render(); });
document.getElementById('refresh').addEventListener('click', () => { tick(); render(); });
function toggleActive() {
  document.getElementById('btn-all').classList.toggle('active', !favs);
  document.getElementById('btn-fav').classList.toggle('active', favs);
}

setInterval(() => { tick(); render(); }, 3000);
render();
</script>
</body>
</html>
