<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Kanban Board — Neon Terminal</title>
<style>
  :root {
    --bg:#050507; --panel:#0b0b10; --panel2:#101018;
    --fg:#e6e6ef; --muted:#8a8a9a;
    --cyan:#22d3ee; --green:#34d399; --magenta:#e879f9; --amber:#fbbf24;
    --border:rgba(140,140,180,.16); --border-hi:rgba(34,211,238,.5);
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  body {
    min-height:100vh; background:var(--bg); color:var(--fg);
    font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
    padding:20px; font-variant-numeric:tabular-nums;
  }
  .wrap { max-width:1180px; margin:0 auto; }
  header {
    display:flex; align-items:center; justify-content:space-between;
    flex-wrap:wrap; gap:14px; padding:14px 18px; margin-bottom:18px;
    border:1px solid var(--border); border-radius:12px;
    background:linear-gradient(180deg, rgba(34,211,238,.08), transparent 70%), var(--panel);
    box-shadow:0 0 24px rgba(34,211,238,.12), inset 0 1px 0 rgba(255,255,255,.04);
  }
  .hud { display:flex; align-items:baseline; gap:10px; }
  h1 { font-size:16px; letter-spacing:.14em; }
  h1 .c { color:var(--cyan); text-shadow:0 0 10px var(--cyan); }
  h1 .g { color:var(--green); text-shadow:0 0 10px var(--green); }
  h1 .m { color:var(--magenta); text-shadow:0 0 10px var(--magenta); }
  .stats { display:flex; gap:18px; font-size:12px; color:var(--muted); }
  .stats b { color:var(--fg); font-size:14px; }
  .stats i { font-style:normal; }
  .toolbar { display:flex; gap:10px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
  .btn {
    font:inherit; font-size:12px; color:var(--fg); background:var(--panel2);
    border:1px solid var(--border); border-radius:8px; padding:8px 14px;
    cursor:pointer; transition:all .18s;
  }
  .btn:hover { border-color:var(--border-hi); box-shadow:0 0 12px rgba(34,211,238,.25); color:var(--cyan); }
  .btn.danger:hover { border-color:var(--magenta); box-shadow:0 0 12px rgba(232,121,249,.25); color:var(--magenta); }
  .btn.primary { border-color:var(--cyan); color:var(--cyan); box-shadow:0 0 12px rgba(34,211,238,.3); }
  .search { flex:1; min-width:180px; }
  .search input {
    width:100%; font:inherit; font-size:12px; color:var(--fg);
    background:var(--panel); border:1px solid var(--border); border-radius:8px;
    padding:8px 12px; outline:none;
  }
  .search input:focus { border-color:var(--border-hi); box-shadow:0 0 10px rgba(34,211,238,.3); }
  .board { display:flex; gap:14px; align-items:flex-start; overflow-x:auto; padding-bottom:12px; }
  .col {
    flex:1 1 0; min-width:270px; border:1px solid var(--border); border-radius:10px;
    background:var(--panel); display:flex; flex-direction:column;
  }
  .col.drag-over { border-color:var(--border-hi); box-shadow:0 0 16px rgba(34,211,238,.35); }
  .col-head {
    display:flex; align-items:center; gap:8px; padding:10px 12px;
    border-bottom:1px solid var(--border);
  }
  .col-title { flex:1; font-size:12px; letter-spacing:.06em; text-transform:uppercase; cursor:pointer; }
  .col-title.editing {
    font:inherit; background:var(--panel2); color:var(--fg);
    border:1px solid var(--border-hi); border-radius:6px; padding:4px 8px; text-transform:none;
    outline:none; width:100%;
  }
  .col-count { font-size:11px; color:var(--muted); min-width:22px; text-align:right; }
  .col .dot { width:8px; height:8px; border-radius:50%; flex:none; box-shadow:0 0 8px currentColor; }
  .col-head .icon {
    font:inherit; background:none; border:none; color:var(--muted); cursor:pointer; font-size:13px; padding:2px 4px;
  }
  .col-head .icon:hover { color:var(--fg); }
  .col-head .icon.del:hover { color:var(--magenta); }
  .cards { padding:10px; display:flex; flex-direction:column; gap:8px; min-height:60px; }
  .card {
    background:var(--panel2); border:1px solid var(--border); border-left:3px solid var(--c,var(--cyan));
    border-radius:8px; padding:8px 10px; cursor:grab; position:relative;
    transition:box-shadow .15s, transform .15s;
  }
  .card:active { cursor:grabbing; }
  .card.dragging { opacity:.45; }
  .card:hover { box-shadow:0 0 12px rgba(34,211,238,.2); }
  .card h3 { font-size:12px; font-weight:600; margin-bottom:4px; word-break:break-word; }
  .card p { font-size:11px; color:var(--muted); margin-bottom:6px; word-break:break-word; }
  .tags { display:flex; gap:4px; flex-wrap:wrap; margin-bottom:4px; }
  .tag { font-size:10px; padding:2px 7px; border-radius:99px; border:1px solid var(--border); color:var(--muted); }
  .card .actions { display:flex; gap:6px; justify-content:flex-end; }
  .card .actions button {
    font:inherit; font-size:11px; background:none; border:1px solid var(--border); color:var(--muted);
    border-radius:6px; padding:2px 8px; cursor:pointer;
  }
  .card .actions button:hover { color:var(--cyan); border-color:var(--border-hi); }
  .card .actions button.del:hover { color:var(--magenta); border-color:var(--magenta); }
  .add-card { font:inherit; font-size:11px; color:var(--muted); background:none; border:none; padding:8px 12px; cursor:pointer; text-align:left; }
  .add-card:hover { color:var(--cyan); }
  .empty { font-size:11px; color:var(--muted); padding:8px 0; text-align:center; border:1px dashed var(--border); border-radius:8px; }
  .modal-bg {
    position:fixed; inset:0; background:rgba(3,3,6,.78); display:none; align-items:center; justify-content:center; z-index:50;
  }
  .modal-bg.open { display:flex; }
  .modal {
    width:min(460px,92vw); background:var(--panel2); border:1px solid var(--border-hi);
    border-radius:12px; padding:18px; box-shadow:0 0 40px rgba(34,211,238,.25);
  }
  .modal h2 { font-size:13px; letter-spacing:.1em; text-transform:uppercase; color:var(--cyan); margin-bottom:14px; }
  .field { margin-bottom:12px; display:flex; flex-direction:column; gap:5px; }
  .field label { font-size:11px; color:var(--muted); }
  .field input, .field textarea {
    font:inherit; font-size:12px; color:var(--fg); background:var(--panel);
    border:1px solid var(--border); border-radius:8px; padding:8px 10px; outline:none; resize:vertical;
  }
  .field input:focus, .field textarea:focus { border-color:var(--border-hi); }
  .tag-input { display:flex; gap:6px; }
  .tag-input input { flex:1; }
  .tag-input button { font:inherit; font-size:11px; color:var(--cyan); background:none; border:1px solid var(--border-hi); border-radius:8px; padding:4px 10px; cursor:pointer; }
  .modal-tags { display:flex; gap:5px; flex-wrap:wrap; margin-top:6px; }
  .modal-tags .tag { cursor:pointer; }
  .modal-tags .tag:hover { border-color:var(--magenta); color:var(--magenta); }
  .modal-actions { display:flex; justify-content:flex-end; gap:10px; margin-top:14px; }
  :focus-visible { outline:2px solid var(--cyan); outline-offset:1px; }
  .col-title:focus-visible, input:focus-visible, textarea:focus-visible, .btn:focus-visible, button:focus-visible { outline:2px solid var(--cyan); }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <div class="hud">
        <h1><span class="c">KANBAN</span><span class="g">·</span><span class="m">BOARD</span></h1>
      </div>
      <div class="stats" aria-label="Board statistics">
        <span>CARDS <b id="statTotal">0</b></span>
        <span>COLS <b id="statCols">0</b></span>
        <span>OPEN <b id="statOpen" style="color:var(--cyan)">0</b></span>
        <span>DONE <b id="statDone" style="color:var(--green)">0</b></span>
      </div>
    </header>

    <div class="toolbar">
      <button class="btn primary" id="addColBtn" aria-label="Add column">+ Add column</button>
      <button class="btn" id="resetBtn">Reset demo</button>
      <div class="search" role="search">
        <input id="searchInput" type="search" placeholder="search cards  (press / to focus)" aria-label="Filter cards" />
      </div>
    </div>

    <div class="board" id="board" role="list" aria-label="Kanban board"></div>
  </div>

  <div class="modal-bg" id="modalBg" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
    <div class="modal">
      <h2 id="modalTitle">Edit card</h2>
      <div class="field">
        <label for="cardTitle">Title</label>
        <input id="cardTitle" type="text" maxlength="80" />
      </div>
      <div class="field">
        <label for="cardDesc">Description</label>
        <textarea id="cardDesc" rows="3" maxlength="300"></textarea>
      </div>
      <div class="field">
        <label for="tagValue">Tags</label>
        <div class="tag-input">
          <input id="tagValue" type="text" placeholder="e.g. bug" />
          <button id="addTagBtn" type="button">Add</button>
        </div>
        <div class="modal-tags" id="modalTags"></div>
      </div>
      <div class="modal-actions">
        <button class="btn" id="modalCancel" type="button">Cancel</button>
        <button class="btn primary" id="modalSave" type="button">Save</button>
      </div>
    </div>
  </div>

<script>
(function () {
  'use strict';
  var storeKey = 'kanban-board-v1';
  var boardEl = document.getElementById('board');
  var searchInput = document.getElementById('searchInput');
  var modalBg = document.getElementById('modalBg');
  var modalTitle = document.getElementById('modalTitle');
  var cardTitle = document.getElementById('cardTitle');
  var cardDesc = document.getElementById('cardDesc');
  var tagValue = document.getElementById('tagValue');
  var modalTagsEl = document.getElementById('modalTags');
  var colColors = ['#22d3ee', '#34d399', '#e879f9', '#fbbf24', '#60a5fa'];

  var state = { cols: [], nextId: 1 };
  var editing = { mode: null, colId: null, cardId: null };
  var modalTags = [];
  var drag = null;
  var dragColId = null;

  var demo = {
    cols: [
      { id: 'c1', title: 'Backlog', cards: [
        { id: 'k1', title: 'Draft landing copy', desc: 'Write hero and feature bullets.', tags: ['copy', 'frontend'] },
        { id: 'k2', title: 'Research pricing', desc: 'Compare 3 alternatives.', tags: ['research'] }
      ] },
      { id: 'c2', title: 'In Progress', cards: [
        { id: 'k3', title: 'Neon theme tokens', desc: 'Finalize CSS custom properties.', tags: ['design', 'css'] },
        { id: 'k4', title: 'Drag-and-drop', desc: 'HTML5 DnD across columns.', tags: ['frontend', 'bug'] }
      ] },
      { id: 'c3', title: 'Done', cards: [
        { id: 'k5', title: 'Setup repo', desc: 'Init monorepo and CI.', tags: ['infra'] },
        { id: 'k6', title: 'Font stack', desc: 'System mono + tabular numerals.', tags: ['design'] }
      ] }
    ],
    nextId: 100
  };

  function load() {
    var raw = null;
    try { raw = localStorage.getItem(storeKey); } catch (e) { raw = null; }
    if (raw) {
      try {
        var parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.cols)) {
          state = parsed;
          if (typeof state.nextId !== 'number') state.nextId = maxId() + 1;
          return;
        }
      } catch (e2) { /* fallthrough to demo */ }
    }
    state = deepDemo();
  }
  function deepDemo() {
    var copy = JSON.parse(JSON.stringify(demo));
    copy.nextId = demo.nextId;
    return copy;
  }
  function persist() {
    try { localStorage.setItem(storeKey, JSON.stringify(state)); } catch (e) { /* private mode */ }
  }
  function maxId() {
    var m = 0;
    state.cols.forEach(function (col) {
      col.cards.forEach(function (card) {
        var n = parseInt(card.id.replace(/[^0-9]/g, ''), 10);
        if (!isNaN(n) && n > m) m = n;
      });
    });
    return m;
  }

  function h(str) {
    return str.replace(/[&<>"]/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
    });
  }

  function statusCounts() {
    var open = 0, done = 0, total = 0;
    state.cols.forEach(function (col) {
      var isDone = /done/i.test(col.title);
      col.cards.forEach(function () {
        total++;
        if (isDone) done++; else open++;
      });
    });
    return { open: open, done: done, total: total };
  }

  function colMatchesFilter(col, q) {
    if (!q) return col.cards.length > 0;
    for (var i = 0; i < col.cards.length; i++) {
      var card = col.cards[i];
      var hay = (card.title + ' ' + card.desc + ' ' + card.tags.join(' ')).toLowerCase();
      if (hay.indexOf(q) !== -1) return true;
    }
    return false;
  }

  function render() {
    var q = searchInput.value.trim().toLowerCase();
    boardEl.innerHTML = '';
    state.cols.forEach(function (col, idx) {
      if (q && !colMatchesFilter(col, q)) return;
      var colEl = document.createElement('section');
      colEl.className = 'col';
      colEl.setAttribute('role', 'listitem');
      colEl.dataset.colId = col.id;

      var head = document.createElement('div');
      head.className = 'col-head';
      var dot = document.createElement('span');
      dot.className = 'dot';
      dot.style.color = col.color || colColors[idx % colColors.length];
      dot.setAttribute('aria-hidden', 'true');
      var title = document.createElement('span');
      title.className = 'col-title';
      title.textContent = col.title;
      title.tabIndex = 0;
      title.setAttribute('role', 'button');
      title.addEventListener('click', function () { startRename(col.id, title); });
      title.addEventListener('keydown', function (e) {
        if (e.key === 'Enter') startRename(col.id, title);
      });
      var count = document.createElement('span');
      count.className = 'col-count';
      count.textContent = col.cards.length;
      count.setAttribute('aria-label', col.cards.length + ' cards');

      var delBtn = document.createElement('button');
      delBtn.className = 'icon del';
      delBtn.textContent = 'x';
      delBtn.setAttribute('aria-label', 'Delete column ' + col.title);
      delBtn.addEventListener('click', function () { deleteColumn(col.id); });

      head.appendChild(dot);
      head.appendChild(title);
      head.appendChild(count);
      head.appendChild(delBtn);

      var cards = document.createElement('div');
      cards.className = 'cards';
      cards.dataset.colId = col.id;

      col.cards.forEach(function (card) {
        cards.appendChild(renderCard(col, card));
      });

      var add = document.createElement('button');
      add.className = 'add-card';
      add.textContent = '+ Add card';
      add.addEventListener('click', function () { openCardModal('add', col.id); });

      var addWrap = document.createElement('div');
      addWrap.appendChild(add);

      colEl.appendChild(head);
      colEl.appendChild(cards);
      colEl.appendChild(addWrap);
      boardEl.appendChild(colEl);
    });
    if (boardEl.children.length === 0) {
      var none = document.createElement('p');
      none.className = 'empty';
      none.textContent = 'No columns match the filter.';
      boardEl.appendChild(none);
    }
    updateStats();
  }

  function renderCard(col, card, idx) {
    var el = document.createElement('article');
    el.className = 'card';
    el.draggable = true;
    el.dataset.cardId = card.id;
    el.style.setProperty('--c', col.color || colColors[idx % colColors.length]);

    var title = document.createElement('h3');
    title.textContent = card.title;
    el.appendChild(title);
    if (card.desc) {
      var p = document.createElement('p');
      p.textContent = card.desc;
      el.appendChild(p);
    }
    if (card.tags && card.tags.length) {
      var tags = document.createElement('div');
      tags.className = 'tags';
      card.tags.forEach(function (t) {
        var tag = document.createElement('span');
        tag.className = 'tag';
        tag.textContent = t;
        tags.appendChild(tag);
      });
      el.appendChild(tags);
    }
    var actions = document.createElement('div');
    actions.className = 'actions';
    var edit = document.createElement('button');
    edit.textContent = 'edit';
    edit.addEventListener('click', function () { openCardModal('edit', col.id, card.id); });
    edit.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.stopPropagation(); openCardModal('edit', col.id, card.id); }
    });
    var del = document.createElement('button');
    del.className = 'del';
    del.textContent = 'delete';
    del.addEventListener('click', function () { deleteCard(card.id); });
    actions.appendChild(edit);
    actions.appendChild(del);
    el.appendChild(actions);

    el.addEventListener('dragstart', function (e) {
      drag = { cardId: card.id, fromColId: col.id };
      dragColId = col.id;
      el.classList.add('dragging');
      e.dataTransfer.effectAllowed = 'move';
      if (e.dataTransfer.setData) e.dataTransfer.setData('text/plain', card.id);
    });
    el.addEventListener('dragend', function () {
      el.classList.remove('dragging');
      clearDragOver();
      drag = null;
    });
    el.addEventListener('keydown', function (e) {
      if (e.key === 'ArrowRight') { e.preventDefault(); moveCard(card.id, 'right'); }
      if (e.key === 'ArrowLeft') { e.preventDefault(); moveCard(card.id, 'left'); }
    });
    return el;
  }

  function moveCard(cardId, dir) {
    var srcIdx = -1;
    for (var i = 0; i < state.cols.length; i++) {
      var idx = state.cols[i].cards.findIndex(function (c) { return c.id === cardId; });
      if (idx !== -1) { srcIdx = i; break; }
    }
    if (srcIdx === -1) return;
    var dstIdx = dir === 'right' ? srcIdx + 1 : srcIdx - 1;
    if (dstIdx < 0 || dstIdx >= state.cols.length) return;
    var card = state.cols[srcIdx].cards.splice(idx, 1)[0];
    state.cols[dstIdx].cards.push(card);
    persist();
    render();
  }

  function deleteCard(cardId) {
    state.cols.forEach(function (col) {
      var i = col.cards.findIndex(function (c) { return c.id === cardId; });
      if (i !== -1) col.cards.splice(i, 1);
    });
    persist();
    render();
  }

  function deleteColumn(colId) {
    var col = state.cols.find(function (c) { return c.id === colId; });
    if (!col) return;
    if (col.cards.length && !confirm('Delete column and its ' + col.cards.length + ' cards?')) return;
    state.cols = state.cols.filter(function (c) { return c.id !== colId; });
    persist();
    render();
  }

  function startRename(colId, el) {
    var input = document.createElement('input');
    input.type = 'text';
    input.className = 'col-title editing';
    input.value = el.textContent;
    input.setAttribute('aria-label', 'Rename column');
    el.parentNode.insertBefore(input, el);
    el.style.display = 'none';
    input.focus();
    input.select();
    var done = function () {
      var val = input.value.trim();
      if (val) {
        var col = state.cols.find(function (c) { return c.id === colId; });
        if (col) col.title = val;
        persist();
      }
      render();
    };
    input.addEventListener('blur', done);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') done();
      if (e.key === 'Escape') render();
    });
  }

  function addColumn() {
    var name = prompt('Column name:');
    if (!name || !name.trim()) return;
    state.cols.push({ id: 'c' + Date.now().toString(36), title: name.trim(), color: colColors[state.cols.length % colColors.length], cards: [] });
    persist();
    render();
  }

  function findCard(cardId) {
    for (var i = 0; i < state.cols.length; i++) {
      var found = state.cols[i].cards.find(function (c) { return c.id === cardId; });
      if (found) return found;
    }
    return null;
  }

  function openCardModal(mode, colId, cardId) {
    editing = { mode: mode, colId: colId, cardId: cardId || null };
    modalTags = [];
    if (mode === 'edit') {
      var card = findCard(cardId);
      if (!card) return;
      modalTitle.textContent = 'Edit card';
      cardTitle.value = card.title;
      cardDesc.value = card.desc || '';
      modalTags = (card.tags || []).slice();
    } else {
      modalTitle.textContent = 'New card';
      cardTitle.value = '';
      cardDesc.value = '';
    }
    renderModalTags();
    modalBg.classList.add('open');
    cardTitle.focus();
  }

  function renderModalTags() {
    modalTagsEl.innerHTML = '';
    modalTags.forEach(function (t, i) {
      var tag = document.createElement('span');
      tag.className = 'tag';
      tag.textContent = t;
      tag.tabIndex = 0;
      tag.setAttribute('role', 'button');
      tag.addEventListener('click', function () { modalTags.splice(i, 1); renderModalTags(); });
      tag.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === 'Backspace') { modalTags.splice(i, 1); renderModalTags(); } });
      modalTagsEl.appendChild(tag);
    });
  }

  function closeModal() {
    modalBg.classList.remove('open');
    modalTags = [];
  }

  function saveCard() {
    var title = cardTitle.value.trim();
    if (!title) { cardTitle.focus(); return; }
    var col = state.cols.find(function (c) { return c.id === editing.colId; });
    if (!col) return;
    if (editing.mode === 'edit') {
      var card = col.cards.find(function (c) { return c.id === editing.cardId; });
      if (card) {
        card.title = title;
        card.desc = cardDesc.value.trim();
        card.tags = modalTags.slice();
      }
    } else {
      col.cards.push({ id: 'k' + (state.nextId++), title: title, desc: cardDesc.value.trim(), tags: modalTags.slice() });
    }
    persist();
    closeModal();
    render();
  }

  function updateStats() {
    var s = statusCounts();
    document.getElementById('statTotal').textContent = s.total;
    document.getElementById('statCols').textContent = state.cols.length;
    document.getElementById('statOpen').textContent = s.open;
    document.getElementById('statDone').textContent = s.done;
  }

  function clearDragOver() { document.querySelectorAll('.col.drag-over').forEach(function (c) { c.classList.remove('drag-over'); }); }

  document.getElementById('addColBtn').addEventListener('click', addColumn);
  document.getElementById('resetBtn').addEventListener('click', function () {
    if (confirm('Reset board to the demo state?')) { state = deepDemo(); persist(); render(); }
  });

  document.getElementById('addTagBtn').addEventListener('click', function () {
    var v = tagValue.value.trim();
    if (v && modalTags.indexOf(v.toLowerCase()) === -1) {
      modalTags.push(v.toLowerCase());
      tagValue.value = '';
      renderModalTags();
    }
    tagValue.focus();
  });
  tagValue.addEventListener('keydown', function (e) {
    if (e.key === 'Enter') {
      e.preventDefault();
      document.getElementById('addTagBtn').click();
    }
  });

  document.getElementById('modalSave').addEventListener('click', saveCard);
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  modalBg.addEventListener('click', function (e) { if (e.target === modalBg) closeModal(); });
  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape' && modalBg.classList.contains('open')) closeModal();
    if (e.key === '/' && document.activeElement !== searchInput) {
      e.preventDefault();
      searchInput.focus();
    }
  });

  searchInput.addEventListener('input', render);

  boardEl.addEventListener('dragenter', function (e) {
    var target = e.target.closest('.col, .cards') || e.target.closest('.col');
    if (!target) return;
    var colEl = target.classList.contains('cards') ? target.closest('.col') : target;
    if (colEl) colEl.classList.add('drag-over');
  });
  boardEl.addEventListener('dragover', function (e) { e.preventDefault(); });
  var lastOver = null;
  boardEl.addEventListener('dragleave', function (e) {
    var colEl = e.target.closest('.col');
    if (colEl && colEl !== lastOver) clearDragOver();
    lastOver = colEl;
  });
  boardEl.addEventListener('drop', function (e) {
    e.preventDefault();
    clearDragOver();
    if (!drag || !drag.cardId) return;
    var colEl = e.target.closest('.col');
    if (!colEl) return;
    var dstColId = colEl.dataset.colId;
    if (!dstColId) return;
    if (dstColId !== drag.fromColId) {
      var col = state.cols.find(function (c) { return c.id === drag.fromColId; });
      var dstCol = state.cols.find(function (c) { return c.id === dstColId; });
      if (col && dstCol) {
        var i = col.cards.findIndex(function (c) { return c.id === drag.cardId; });
        if (i !== -1) {
          var card = col.cards.splice(i, 1)[0];
          dstCol.cards.push(card);
        }
      }
    }
    drag = null;
    persist();
    render();
  });

  load();
  render();
})();
</script>
</body>
</html>
