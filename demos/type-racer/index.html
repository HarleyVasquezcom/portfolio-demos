<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Type Racer — Speed Test</title>
<style>
  :root { --bg:#09090b; --fg:#fafafa; --muted:#a1a1aa; --border:#27272a; --border-hover:#3f3f46; --up:#34d399; --err:#f87171; --accent:#22d3ee; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { min-height:100vh; background:radial-gradient(1000px 500px at 20% -10%, rgba(34,211,238,.08), transparent 60%), var(--bg); color:var(--fg); font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace; display:flex; align-items:center; justify-content:center; padding:24px; }
  .wrap { width:100%; max-width:760px; }
  header { display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; color:var(--muted); font-size:13px; }
  h1 { font-size:18px; color:var(--fg); } h1 span { color:var(--accent); }
  .stats { display:flex; gap:16px; } .stats b { color:var(--fg); font-variant-numeric:tabular-nums; }
  .text { background:#131316; border:1px solid var(--border); border-radius:14px; padding:20px; font-size:20px; line-height:1.9; min-height:140px; user-select:none; }
  .word { display:inline-block; margin-right:10px; }
  .char { position:relative; }
  .char.correct { color:var(--fg); }
  .char.wrong { color:var(--err); text-decoration:underline; }
  .char.current::before { content:''; position:absolute; left:-1px; right:-1px; bottom:2px; height:2px; background:var(--accent); border-radius:2px; }
  .hidden-input { position:fixed; left:-9999px; }
  .panel { margin-top:16px; display:flex; gap:10px; align-items:center; }
  .panel button { border:1px solid var(--border); background:#131316; color:var(--fg); font:inherit; font-size:13px; padding:9px 16px; border-radius:10px; cursor:pointer; transition:all .2s; }
  .panel button:hover { border-color:var(--border-hover); color:var(--accent); }
  .hint { color:var(--muted); font-size:12px; margin-left:auto; }
  .results { display:none; margin-top:16px; background:#131316; border:1px solid var(--border); border-radius:14px; padding:18px; }
  .results.on { display:block; }
  .results .grid { display:grid; grid-template-columns:repeat(3,1fr); gap:12px; }
  .metric { text-align:center; } .metric .k { color:var(--muted); font-size:12px; } .metric .v { font-size:26px; color:var(--fg); font-variant-numeric:tabular-nums; }
</style>
</head>
<body>
  <div class="wrap">
    <header>
      <h1>TYPE<span>·</span>RACER</h1>
      <div class="stats"><span>WPM <b id="live-wpm">0</b></span><span>ACC <b id="live-acc">100%</b></span></div>
    </header>
    <div class="text" id="quoted" tabindex="0" role="textbox" aria-label="type the following text"></div>
    <div class="panel">
      <button id="restart">↻ Restart</button>
      <button id="switch">New phrase</button>
      <span class="hint">click the text to focus, then just type…</span>
    </div>
    <input class="hidden-input" id="typer" autocomplete="off" autocapitalize="off" spellcheck="false" />
    <div class="results" id="results">
      <div class="grid">
        <div class="metric"><div class="num">WPM</div><div class="v" id="r-wpm">0</div></div>
        <div class="metric"><div class="num">Accuracy</div><div class="v" id="r-acc">0%</div></div>
        <div class="metric"><div class="num">Chars</div><div class="v" id="r-chars">0/0</div></div>
      </div>
      <div class="grid" style="margin-top:14px">
        <div class="metric"><div class="num">Time</div><div class="v" id="r-time">0.0s</div></div>
        <div class="metric"><div class="num">CPS</div><div class="v" id="r-cps">0</div></div>
        <div class="metric"><div class="num">Raw</div><div class="v" id="r-raw">0</div></div>
      </div>
    </div>
  </div>
<script>
const PHRASES = [
  "The quick brown fox jumps over the lazy dog while the moon rises over the silent town and distant hills hum with electric light.",
  "Metallic precision meets vibrant motion in every pixel rendered on the modern web canvas of tomorrow.",
  "Software craftsmanship is the quiet discipline of turning ambiguous ideas into reliable running systems.",
  "Typing fast is a skill, typing accurately is an art, and both together become a superhuman rhythm.",
  "Persistent curiosity beats raw talent. Learn the tool, break the tool, rebuild the tool, repeat.",
  "Elegant code reads like poetry to those who listen and runs like lightning on hardware that obeys.",
  "Every keystroke you make pushes a tiny wave through the network toward someone waiting for an answer today.",
  "Design the edge carefully, celebrate the details, and ship a surface people love to touch.",
];
let words = [];
let index = 0;       // character index across text
let errors = 0;
let startedAt = null;
let done = false;
let phrase = PHRASES[0];

const quoted = document.getElementById('quoted');
const typer = document.getElementById('typer');

function loadPhrase() {
  phrase = PHRASES[Math.floor(Math.random() * PHRASES.length)];
  done = false; startedAt = null; index = 0; errors = 0;
  words = phrase.split(' ');
  typer.value = '';
  typer.disabled = false;
  document.getElementById('results').classList.remove('on');
  renderText();
  liveStats();
}

function renderText() {
  quoted.innerHTML = '';
  let wi = 0;
  for (const w of words) {
    const span = document.createElement('span');
    span.classList.add('word');
    for (const ch of w) {
      const chEl = document.createElement('span');
      chEl.classList.add('char');
      chEl.dataset.idx = wi;
      chEl.textContent = ch;
      span.appendChild(chEl);
      wi++;
    }
    const sep = document.createElement('span');
    sep.classList.add('char');
    sep.dataset.idx = wi;
    sep.textContent = ' ';
    span.appendChild(sep);
    wi++;
    quoted.appendChild(span);
  }
  updateMarks();
}

function charEls() { return Array.from(quoted.querySelectorAll('.char')); }

function updateMarks() {
  const els = charEls();
  els.forEach((el, i) => {
    const data = el.dataset.idx;
    const num = Number(data);
    el.classList.remove('correct','wrong','current');
    if (num > index) return;
    if (num < index) {
      el.classList.add('correct');
    } else if (num === index) {
      el.classList.add('current');
    }
  });
  // wrong highlighting based on diff
  els.forEach((el) => {
    const num = Number(el.dataset.idx);
    if (num < index) {
      const expected = phrase[num];
      const typed = typer.value[num];
      if (typed === expected) el.classList.add('correct');
      else el.classList.add('wrong');
    }
  });
}

function liveStats() {
  const charsTyped = index;
  const elapsed = startedAt ? (performance.now() - startedAt) / 1000 : 0;
  const wpm = elapsed > 0 ? (charsTyped / 5) / (elapsed / 60) : 0;
  const acc = charsTyped > 0 ? Math.max(0, 100 * ((charsTyped - errors) / charsTyped)) : 100;
  document.getElementById('live-wpm').textContent = Math.round(wpm);
  document.getElementById('live-acc').textContent = `${Math.round(acc)}%`;
}

quoted.addEventListener('click', () => typer.focus());
typer.focus();

typer.addEventListener('beforeinput', () => {
  if (!startedAt) startedAt = performance.now();
});

typer.addEventListener('input', () => {
  if (done) return;
  const val = typer.value;
  index = val.length;
  errors = 0;
  const expected = phrase;
  for (let i = 0; i < Math.min(index, expected.length); i++) if (val[i] !== expected[i]) errors++;
  updateMarks();
  if (index >= expected.length) finish();
  liveStats();
});

function finish() {
  done = true;
  const elapsed = (performance.now() - startedAt) / 1000;
  const chars = phrase.replace(/ /g, '').length;
  const wpm = (chars / 5) / (elapsed / 60);
  const acc = (chars - errors) / chars * 100;
  document.getElementById('r-wpm').textContent = Math.round(wpm);
  document.getElementById('r-acc').textContent = `${Math.round(Math.max(0, acc))}%`;
  document.getElementById('r-chars').textContent = `${chars}/${chars}`;
  document.getElementById('r-time').textContent = `${elapsed.toFixed(1)}s`;
  document.getElementById('r-cps').textContent = (chars / elapsed).toFixed(1);
  document.getElementById('r-raw').textContent = Math.round((index / 5) / (elapsed / 60));
  document.getElementById('results').classList.add('on');
}

document.getElementById('restart').addEventListener('click', loadPhrase);
document.getElementById('switch').addEventListener('click', loadPhrase);

loadPhrase();
</script>
</body>
</html>
